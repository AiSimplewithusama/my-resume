<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume</title>
  <meta name="description" content="Personal resume website">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before the page paints, so there is no flash of the wrong colours.
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <span class="topbar-name" id="topbar-name"></span>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme">
      <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>
    </button>
  </header>

  <main id="main" class="container">
    <section class="hero" aria-labelledby="name">
      <img class="photo" id="photo" src="" alt="" width="160" height="160">
      <div class="hero-text">
        <h1 id="name"></h1>
        <p class="title" id="title"></p>
        <p class="location" id="location"></p>
        <p class="intro" id="intro"></p>
        <nav class="actions" id="actions" aria-label="Contact links"></nav>
      </div>
    </section>

    <section class="section" aria-labelledby="experience-heading">
      <h2 id="experience-heading">Experience</h2>
      <div id="experience" class="timeline"></div>
    </section>

    <section class="section" aria-labelledby="skills-heading">
      <h2 id="skills-heading">Skills</h2>
      <ul id="skills" class="chips"></ul>
    </section>

    <section class="section" aria-labelledby="projects-heading">
      <h2 id="projects-heading">Projects</h2>
      <div id="projects" class="cards"></div>
    </section>

    <section class="section" aria-labelledby="certs-heading">
      <h2 id="certs-heading">Certifications</h2>
      <ul id="certifications" class="certs"></ul>
    </section>
  </main>

  <footer class="footer">
    <p id="footer-text"></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
